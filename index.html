<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mrオカッパ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap&text=Mr%E3%82%AA%E3%82%AB%E3%83%83%E3%83%91%E8%A8%AD%E5%AE%9A%E8%BD%A2%E3%81%8B%E3%82%8C%E3%81%9F%E3%80%82%E3%83%A9%E3%83%B3%E3%82%AD%E3%83%B3%E3%82%B0" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#eee}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.92));z-index:5}
.ov.on{display:flex}
h1{margin:0 0 10px;font-size:clamp(40px,12vw,64px);color:#ff2222;letter-spacing:.06em;text-shadow:0 0 18px rgba(255,30,30,.7)}
.sub{font-size:14px;line-height:1.9;opacity:.85;margin:0 0 26px}
.row{display:flex;flex-direction:column;gap:14px;align-items:center}
button{font:inherit;font-weight:700;letter-spacing:.2em;width:230px;padding:18px 0;border-radius:0;border:2px solid #888;background:#0008;color:#fff;touch-action:manipulation}
button.p{background:#ff2020;border-color:#ff2020;box-shadow:0 0 22px rgba(255,30,30,.55)}
#toast{margin-top:14px;font-size:12px;opacity:0;transition:opacity .3s;height:16px}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:none;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;pointer-events:none;letter-spacing:.15em;font-size:13px;color:#aaa}
#hud i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e22;margin-right:6px;animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}
#tm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);left:0;right:0;text-align:center;font-size:34px;font-weight:700;display:none;text-shadow:0 0 10px #000;pointer-events:none}
#joy{position:fixed;left:0;bottom:0;width:100%;height:50%;display:none}
#base{position:absolute;left:50%;margin-left:-65px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:130px;height:130px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff14}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#ff3030cc;box-shadow:0 0 14px #f33}
#flash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 35%,#f00);opacity:0;pointer-events:none}
#home button,#set button,#rk button,#team button,#lobby button,#mode button{width:150px;padding:10px 0;font-size:13px;letter-spacing:.15em}
#home .row{gap:10px}
.set{width:min(300px,86vw);text-align:left;font-size:14px;margin-bottom:10px}
.set label{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.set input[type=range]{width:100%;margin:0 0 22px;accent-color:#ff2020;touch-action:pan-x}
#set button.tg{width:64px;padding:6px 0;font-size:12px;letter-spacing:0}
#set button.tg.on{background:#ff2020;border-color:#ff2020}
#rk button.tab{width:100px;padding:8px 0;font-size:12px;letter-spacing:0}
#rk button.tab.on{background:#ff2020;border-color:#ff2020}
.rr .n.w{white-space:normal;font-size:12px;line-height:1.4}
#cry{position:fixed;top:calc(env(safe-area-inset-top,0px) + 86px);left:0;right:0;text-align:center;font-size:18px;display:none;pointer-events:none;text-shadow:0 0 8px #000}
#jump{position:fixed;z-index:8;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:84px;height:84px;padding:0;border-radius:50%;letter-spacing:.05em;font-size:14px;display:none;background:#ff2020aa;border:2px solid #fff8;touch-action:manipulation}
#scare{position:fixed;inset:0;z-index:40;display:none;background:#000;overflow:hidden;pointer-events:none}
#scare img{position:absolute;left:50%;top:50%;height:130vh;width:auto;max-width:none;transform:translate(-50%,-50%) scale(.08)}
#scare.go{animation:scbg 1.6s steps(1) forwards}
#scare.go img{animation:scz 1.6s linear forwards}
@keyframes scbg{0%{background:#000}8%{background:#f00}14%{background:#000}22%{background:#a00}30%{background:#000}45%{background:#600}60%,100%{background:#000}}
@keyframes scz{0%{transform:translate(-50%,-50%) scale(.08)}6%{transform:translate(-50%,-50%) scale(1)}9%{transform:translate(-46%,-53%) scale(1.15) rotate(-3deg)}12%{transform:translate(-54%,-47%) scale(1.2) rotate(3deg)}15%{transform:translate(-47%,-51%) scale(1.25) rotate(-2deg)}18%{transform:translate(-53%,-49%) scale(1.2) rotate(2deg)}22%{transform:translate(-48%,-52%) scale(1.3) rotate(-3deg)}26%{transform:translate(-52%,-48%) scale(1.25) rotate(3deg)}30%{transform:translate(-49%,-51%) scale(1.3) rotate(-2deg)}35%{transform:translate(-51%,-49%) scale(1.3) rotate(2deg)}100%{transform:translate(-50%,-50%) scale(1.45)}}
#scNoise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.25;pointer-events:none}
#cmsg{position:fixed;z-index:9;left:0;right:0;top:28%;text-align:center;padding:0 16px;font-size:clamp(18px,5.2vw,28px);font-weight:700;color:#ff3030;letter-spacing:.08em;text-shadow:0 0 14px #000,0 0 6px #f00;display:none;pointer-events:none}
#mute{position:fixed;z-index:20;right:12px;top:calc(env(safe-area-inset-top,0px) + 42px);width:32px;height:32px;padding:0;letter-spacing:0;font-size:15px;border-radius:50%;border:1px solid #ffffff55;background:#0006}
h1{font-family:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;transform:skewX(-6deg);text-shadow:0 0 18px rgba(255,30,30,.7),3px 3px 0 #500}
#home h1{font-size:clamp(34px,11vw,56px);margin-bottom:6px;white-space:nowrap;letter-spacing:.02em}
input,#name{user-select:text;-webkit-user-select:text;touch-action:manipulation}
#name,#code{width:170px;padding:9px 8px;margin:0 0 10px;border:2px solid #888;border-radius:0;background:#0008;color:#fff;font:inherit;font-size:14px;text-align:center;outline:none}
#name:focus,#code:focus{border-color:#ff2020}
.ov{overflow-y:auto}
#home .sub{font-size:12px;line-height:1.7;margin-bottom:14px}
#home .sub b{color:#ff6060}
button.dis{opacity:.4;border-style:dashed}
.rules{font-size:12px;line-height:1.7;opacity:.85;text-align:left;width:min(320px,88vw);margin:0 0 12px;padding:10px 12px;border:1px solid #ffffff33;background:#0006}
#rl{width:min(320px,88vw);max-height:42vh;overflow-y:auto;margin-bottom:14px;font-size:14px;text-align:left}
.rr{display:flex;gap:8px;padding:5px 6px;border-bottom:1px solid #ffffff1a}
.rr .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .k{width:28px;color:#ff6060}
.rr .s{font-family:ui-monospace,Menlo,monospace}
.rr.me{background:#ff202033}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span><i></i>REC</span><span id="best"></span></div>
<div id="tm">0.0秒</div>
<div id="joy"><div id="base"><div id="knob"></div></div></div>
<div id="flash"></div>
<div id="scare"><img id="scImg" alt=""><canvas id="scNoise"></canvas></div>
<div id="cry">💎 残り <b id="cn"></b></div>
<button id="jump">JUMP</button>
<div id="cmsg"></div>
<button id="mute" aria-label="sound">🔊</button>

<div id="home" class="ov on">
  <h1>Mrオカッパ</h1>
  <input id="name" maxlength="10" placeholder="ユーザーネーム" autocomplete="off">
  <div class="row"><button class="p" id="start">生き残る</button><button id="rank">ランキング</button><button id="gear">設定</button></div>
  <div id="toast">ランキングは準備中です</div>
</div>
<div id="kind" class="ov">
  <h1 style="font-size:36px">生き残る</h1>
  <div class="row"><button class="p" id="toDodge">避ける</button><button class="p" id="toEsc">逃走</button><button id="kindBack">戻る</button></div>
</div>
<div id="esc" class="ov">
  <h1 style="font-size:36px">逃走</h1>
  <div class="row"><button class="p" id="escSolo">ソロ（ダイヤ3個）</button><button class="p" id="escParty">パーティ（ダイヤ3個）</button><button id="escBack">戻る</button></div>
</div>
<div id="mode" class="ov">
  <h1 style="font-size:36px">避ける</h1>
  <div class="row"><button class="p" id="normal">ノーマル</button><button class="dis" id="hard">ハード（準備中）</button><button id="modeBack">戻る</button></div>
  <div id="toast2" style="margin-top:14px;font-size:12px;opacity:0;transition:opacity .3s;height:16px">ハードは準備中です</div>
</div>
<div id="rk" class="ov">
  <h1 style="font-size:36px">ランキング</h1>
  <div class="row" style="flex-direction:row;gap:8px;margin-bottom:10px"><button class="tab on" id="tabD">避ける</button><button class="tab" id="tabS">逃走ソロ</button><button class="tab" id="tabT">逃走パーティ</button></div>
  <div id="rl"></div>
  <div class="row"><button class="p" id="rkBack">戻る</button></div>
</div>
<div id="team" class="ov">
  <h1 style="font-size:36px">チーム</h1>
  <div class="row"><button class="p" id="mkB">ルームを作る</button><input id="code" inputmode="numeric" maxlength="4" placeholder="ルーム番号(4桁)"><button id="jnB">参加する</button><button id="tBack">戻る</button></div>
  <div id="tmsg" style="margin-top:12px;font-size:12px;min-height:16px;color:#ff8080"></div>
</div>
<div id="lobby" class="ov">
  <h1 style="font-size:30px">ルーム <span id="lc"></span></h1>
  <div class="rules" id="ll" style="font-size:15px"></div>
  <p class="sub" id="lh" style="font-size:12px;margin:0 0 12px"></p>
  <div class="row"><button class="p" id="goBtn">スタート</button><button id="lvBtn">抜ける</button></div>
</div>
<div id="set" class="ov">
  <h1 style="font-size:36px">設定</h1>
  <div class="set">
    <label>BGM <button class="tg" id="bgmT">ON</button></label>
    <label>ジャンプボタン <button class="tg" id="jumpT">右</button></label>
    <label>ジョイスティックの速さ <b id="sv">1.0</b></label>
    <input type="range" id="sens" min="0.5" max="2" step="0.1" value="1">
  </div>
  <div class="row"><button class="p" id="setBack">戻る</button></div>
</div>
<div id="over" class="ov">
  <h1 id="oh" style="font-size:44px">轢かれた。</h1>
  <p class="sub" id="res"></p>
  <div class="row"><button class="p" id="retry">もう一回</button><button id="toHome">ホーム</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function genMaze(seed,n,m){
  const R=mb32(seed),g=[],vis=[];
  for(let y=0;y<GN;y++)g.push(new Array(GN).fill(1));
  for(let y=0;y<CW;y++)vis.push(new Array(CW).fill(false));
  const st=[[0,0]];vis[0][0]=true;g[1][1]=0;

    if(!nb.length){st.pop();continue}
    const a=nb[Math.floor(R()*nb.length)];
    g[c[1]*2+1+a[2][1]][c[0]*2+1+a[2][0]]=0;g[a[1]*2+1][a[0]*2+1]=0;vis[a[1]][a[0]]=true;st.push([a[0],a[1]]);
  }
  for(let i=0;i<CW*CW*.12;i++){
    const x=1+Math.floor(R()*(GN-2)),y=1+Math.floor(R()*(GN-2));
    if(g[y][x]===1&&((x%2===0&&y%2===1)||(x%2===1&&y%2===0)))g[y][x]=0;
  }
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const tmp=a[i];a[i]=a[j];a[j]=tmp}return a};
  const cand=[];
  for(let y=0;y<CW;y++)for(let x=0;x<CW;x++)if(x+y>=7)cand.push([x,y]);
  shuf(cand);

  for(const c of cand){if(cr.length>=n)break;if(cr.every(o=>Math.abs(o[0]-c[0])+Math.abs(o[1]-c[1])>=4))cr.push(c)}
  for(const c of cand){if(cr.length>=n)break;if(cr.indexOf(c)<0)cr.push(c)}
  const c2=[];
  for(let y=0;y<CW;y++)for(let x=0;x<CW;x++)if(x+y>=6)c2.push([x,y]);
  shuf(c2);

}

// 最大4体。1体目は常にいて、2〜4体目はランダムな時間だけ湧いて消える
function estep(dt){
  et+=dt;
  for(const e of mEn){
    if(e.i>0){
      while(e.ix<e.ints.length&&et>=e.ints[e.ix][1])e.ix++;
      const cur=e.ix<e.ints.length?e.ints[e.ix]:null;
      const act=!!cur&&et>=cur[0];
      if(act&&!e.on){
        const cx=Math.floor(e.S()*CW),cy=Math.floor(e.S()*CW);
        e.fx=e.tx=cx*2+1;e.fy=e.ty=cy*2+1;e.px=e.py=-1;e.prog=1;e.age=0;e.on=true;
      }
      if(!act&&e.on)e.on=false;
      e.rem=act?cur[1]-et:0;
    }
    if(!e.on){e.k=0;continue}
    e.age+=dt;
    e.k=Math.min(1,e.age)*Math.min(1,e.rem/.6);
    e.prog+=ESP*dt/TS;
    while(e.prog>=1){
      e.prog-=1;e.fx=e.tx;e.fy=e.ty;
      const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>!grid[e.fy+d[1]][e.fx+d[0]]);
      let cd=opts.filter(d=>!(e.fx+d[0]===e.px&&e.fy+d[1]===e.py));
      if(!cd.length)cd=opts;
      const d=cd[Math.floor(e.R()*cd.length)];
      e.px=e.fx;e.py=e.fy;e.tx=e.fx+d[0];e.ty=e.fy+d[1];
    }
    e.x=(e.fx+(e.tx-e.fx)*e.prog)*TS;e.z=(e.fy+(e.ty-e.fy)*e.prog)*TS;
  }
}

function teamFrame(dt,now){

    const sy=Math.max(-1,Math.min(1,jy+((key.KeyW||key.ArrowUp)?1:0)-((key.KeyS||key.ArrowDown)?1:0)));

const BGM=(()=>{

  function play(s,t0,sp,tg){

        const o=ac.createOscillator();o.type=i%2?'sawtooth':'square';
        o.frequency.setValueAtTime(q[0],n);o.frequency.exponentialRampToValueAtTime(q[1],n+.25);o.frequency.exponentialRampToValueAtTime(q[0]*.7,n+1.5);
        const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=38+i*9;lg.gain.value=q[0]*.35;l.connect(lg);lg.connect(o.frequency);l.start(n);l.stop(n+1.7);
        o.connect(ws);o.start(n);o.stop(n+1.7);
      });
      const sn=ac.createBufferSource(),ng=ac.createGain(),bf=ac.createBiquadFilter();
      sn.buffer=nbuf;sn.loop=true;bf.type='highpass';bf.frequency.value=1200;
      ng.gain.setValueAtTime(.7,n);ng.gain.setValueAtTime(.7,n+1.2);ng.gain.linearRampToValueAtTime(0,n+1.8);
      sn.connect(bf);bf.connect(ng);ng.connect(master);sn.start(n);sn.stop(n+1.9);
      osc('sine',70,n,.002,1.3,1,25);
    },
    beat(){if(!ac)return;const n=ac.currentTime;kick(n,.9);kick(n+.17,.6)},
    jump(){if(!ac)return;const n=ac.currentTime;osc('square',280,n,.003,.18,.14,620)},
    ping(){if(!ac)return;const n=ac.currentTime;osc('triangle',1318,n,.003,.5,.5);osc('triangle',1760,n+.08,.003,.5,.8)},
    win(){if(!ac)return;const n=ac.currentTime;[523,659,784,1047,1319].forEach((f,i)=>{osc('triangle',f,n+i*.13,.005,.5,.9);osc('sine',f/2,n+i*.13,.005,.4,.9)})},
    start(){init();ac.resume();clearInterval(tmr);on=true;step=0;bar=0;nt=ac.currentTime+.1;tmr=setInterval(tick,25)},
    stop(hit){
      if(!ac)return;on=false;clearInterval(tmr);
      if(hit){const n=ac.currentTime;kick(n,1.3);osc('sine',90,n,.002,1,1.2,28);crash(n,.8);snare(n,1)}
    },
    set(m){init();muted=m;localStorage.setItem('okappaMute',m?'1':'0');master.gain.setTargetAtTime(m?0:1.8,ac.currentTime,.03)},
    toggle(){init();muted=!muted;localStorage.setItem('okappaMute',muted?'1':'0');master.gain.setTargetAtTime(muted?0:1.8,ac.currentTime,.03);return muted},
    get muted(){return muted}
  };
})();
const mb=$('mute'),bt=$('bgmT'),sl=$('sens');
let sens=+localStorage.getItem('okappaSens')||1;
function ui(){mb.textContent=BGM.muted?'🔇':'🔊';bt.textContent=BGM.muted?'OFF':'ON';bt.classList.toggle('on',!BGM.muted)}
ui();
mb.onclick=()=>{BGM.toggle();ui()};
bt.onclick=()=>{BGM.set(!BGM.muted);ui()};
sl.value=sens;$('sv').textContent=sens.toFixed(1);
sl.oninput=()=>{sens=+sl.value;$('sv').textContent=sens.toFixed(1);localStorage.setItem('okappaSens',sens)};
$('gear').onclick=()=>{show('home',false);show('set',true)};
$('setBack').onclick=()=>{show('set',false);show('home',true)};

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(gm==='team'&&state!=='home'){teamFrame(dt,now);ren.render(scene,cam);return}
  if(state==='play'){
    t+=dt;$('tm').textContent=t.toFixed(1)+'秒';
    const ix=Math.max(-1,Math.min(1,jx+((key.KeyD||key.ArrowRight)?1:0)-((key.KeyA||key.ArrowLeft)?1:0)));
    vx+=(ix*8.5*sens-vx)*Math.min(1,dt*14);
    px=Math.max(-LIM,Math.min(LIM,px+vx*dt));
    spawnT-=dt;if(spawnT<=0){wave();spawnT=Math.max(.5,1.7-t*.02)}
    let near=99;
    for(const e of en){
      e.z+=e.sp*dt;
      const x=e.x0+Math.sin(now/500+e.ph)*e.amp;
      e.g.position.set(x,e.h+Math.sin(now/200+e.ph)*.1,e.z);
      e.g.rotation.y=Math.sin(now/350+e.ph)*.4;e.g.rotation.z=Math.sin(now/260+e.ph)*.07;
      if(e.z>-1.2&&e.z<.8){const w=e.sz*.4+.3;if(Math.abs(x-px)<w){die();break}}
      if(e.z>-14&&e.z<1)near=Math.min(near,-e.z+.5+Math.abs(x-px)*.5);
    }
    en=en.filter(e=>{if(e.z>3){scene.remove(e.g);return false}return true});
    if(state==='play')$('flash').style.opacity=Math.max(0,Math.min(.4,(8-near)/8*.4));
  }
  shake*=Math.pow(.02,dt);
  const sx=(Math.random()-.5)*shake*.3;
  if(state==='home'){const a=now/4000;cam.position.set(Math.sin(a)*2,EYE,0);cam.rotation.set(0,Math.sin(a*.7)*.3,0)}
  else{cam.position.set(px+sx,EYE+(Math.random()-.5)*shake*.2,0);cam.rotation.set(0,0,-vx*.012)}
  ceilL.intensity=.6+(Math.random()<.03?-.3:0);
  ren.render(scene,cam);
}
requestAnimationFrame(loop);
</script></body></html>
